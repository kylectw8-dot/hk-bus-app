<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086b58"><meta name="description" content="搜尋九巴、龍運及城巴路線、查閱巴士到站時間並收藏常用巴士站。"><title>下一班 NextBus｜香港巴士到站</title><link rel="stylesheet" href="./styles.css"></head>
<body><header><div class="brand"><span class="logo" aria-hidden="true">↗</span><div><strong>下一班 <small>NextBus</small></strong><p>香港巴士到站 · 九巴／龍運／城巴</p></div></div><span class="pill">開放數據</span></header>
<main><section class="intro"><span class="eyebrow">你的日常路線，一眼掌握</span><h1>下一班，仲有幾耐？</h1><p>搜尋路線，選擇巴士站，即刻查看到站預報。</p></section>
<nav aria-label="功能"><button id="search-tab" class="active" aria-pressed="true">路線搜尋</button><button id="fav-tab" aria-pressed="false">我的收藏 <span id="fav-count">0</span></button></nav>
<section id="search-panel"><label for="operator">巴士公司</label><select id="operator"><option value="ALL">全部公司</option><option value="KMB">九巴／龍運</option><option value="CTB">城巴</option></select><label for="query">巴士路線</label><div class="search-box"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="例如 960、299X、A43" autocomplete="off" maxlength="12"><button id="reload" title="重新載入路線">重新載入</button></div><p id="operator-status" role="status">正在載入巴士公司資料…</p><p id="route-status" role="status">正在載入路線…</p><div id="routes" class="grid"></div></section>
<section id="fav-panel" hidden><h2>常用巴士站</h2><p class="muted">點選收藏，查看最新到站時間。</p><div id="favourites" class="grid"></div></section>
<section id="detail" hidden aria-label="路線詳情"><div class="section-heading"><div><span class="eyebrow">已選路線</span><h2 id="route-title"></h2></div><button id="close-detail">關閉</button></div><p id="route-description"></p><label for="stop-select">選擇巴士站</label><select id="stop-select"></select><p id="stop-status" role="status"></p><article class="eta-card"><div class="section-heading"><div><span class="eyebrow">到站預報</span><h3 id="stop-name">請選擇巴士站</h3></div><button id="save" disabled>☆ 收藏</button></div><div id="etas" aria-live="polite"></div><div class="eta-footer"><span id="updated">尚未更新</span><button id="refresh" disabled>更新到站時間</button></div></article></section>
<footer>到站資料：<a href="https://data.gov.hk/tc-data/dataset/hk-td-tis_21-etakmb" target="_blank" rel="noopener noreferrer">九巴／龍運開放數據</a> · <a href="https://data.gov.hk/tc-data/dataset/ctb-eta-transport-realtime-eta" target="_blank" rel="noopener noreferrer">城巴開放數據</a><p>預報僅供參考，以營辦商公布為準。收藏儲存在此瀏覽器。</p><p>每 60 秒更新目前選定巴士站；離開此頁或切換至背景時暫停。</p></footer></main><script type="module" src="./app.js"></script></body></html>
